# waread-passkey.example.conf - BEISPIEL (wird von install.sh NICHT installiert und NICHT automatisch eingebunden)
#
# Wozu: Passkeys (WebAuthn) funktionieren nur in einem sicheren Kontext (HTTPS) und nur mit einem Host-NAMEN,
# nicht mit einer IP-Adresse. Die bestehende Einbindung http://<Pi-IP>/waread/ kann deshalb keine Passkeys.
# Dieses Beispiel ist ein ZUSÄTZLICHER, eigener server-Block für einen NEUEN Namen. Er ändert keinen bestehenden
# server-Block, insbesondere keinen des Craft-Systems. Vor dem Einbinden:
#   - einen Namen wählen, der im Heimnetz auf den Pi zeigt (Router-DNS/Hosts-Eintrag), z. B. waread.heimnetz.example
#   - Zertifikat und Schlüssel für GENAU diesen Namen bereitstellen. Wie das gehen kann (eigene CA, mkcert, Zertifikat
#     einer eigenen Domain) ist deine Entscheidung; dieses Paket legt keines an.
#     UNBEKANNT (nicht getestet): ob Safari/iOS Passkeys mit einem selbst signierten Zertifikat zulässt.
#     Ein auf dem iPhone installiertes UND als vertrauenswürdig aktiviertes CA-Zertifikat ist der übliche Weg; geprüft ist das hier nicht.
#   - in /etc/waread/config.toml setzen (und waread-web neu starten):
#         [web]
#         passkey_rp_id = "waread.heimnetz.example"
#         passkey_origin = "https://waread.heimnetz.example"
#
# Einbinden (von Hand): Datei nach /etc/nginx/conf.d/ oder sites-available kopieren, Platzhalter ersetzen, dann
#   sudo nginx -t && sudo systemctl reload nginx
# Hört der Block auf Port 443 und gehört bereits ein anderer server-Block zu diesem Port, wird er über server_name
# unterschieden; dein vorhandener Block bleibt unverändert.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name waread.heimnetz.example;                       # PLATZHALTER: dein Name

    ssl_certificate     /etc/ssl/waread/waread.crt;            # PLATZHALTER
    ssl_certificate_key /etc/ssl/waread/waread.key;            # PLATZHALTER (Rechte 0600, nur root)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Nur waread. Alles andere unter diesem Namen gibt es nicht.
    # Der Snippet-Inhalt (Präfix /waread/, SSE, Header) ist derselbe wie im bestehenden Betrieb.
    include /etc/nginx/snippets/waread.conf;

    location = / {
        return 302 /waread/;
    }
}
