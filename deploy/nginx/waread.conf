# waread.conf - Nginx-Snippet für waread
#
# EIGENSTÄNDIGES Snippet. Es ändert keinen bestehenden Server-Block. install.sh legt
# es nur als Datei ab (/etc/nginx/snippets/waread.conf); eingebunden wird es von Hand,
# INNERHALB des server-Blocks, über den waread im Heimnetz erreichbar sein soll:
#
#     server {
#         ...bestehende Einstellungen bleiben unverändert...
#         include /etc/nginx/snippets/waread.conf;
#     }
#
# Danach:  nginx -t && systemctl reload nginx
#
# Annahmen (siehe deploy/README.md):
#   - Das Backend lauscht auf 127.0.0.1:8780. Der Port ist ein Standardwert dieses Pakets;
#     er muss zum Port in /etc/waread/config.toml passen. Bei Änderung: unten ALLE
#     "127.0.0.1:8780" ersetzen (und update_health_url für waread-update anpassen).
#   - Nginx entfernt das Präfix /waread/ (wegen des "/" am Ende von proxy_pass). Das Backend
#     sieht also /healthz, /events, /api/login usw. ohne Präfix. Das Frontend verwendet deshalb
#     ausschließlich relative URLs (services/web/public/src/api.ts, apiUrl) und liegt unter /waread/.

# /waread (ohne Schrägstrich) -> /waread/
location = /waread {
    return 301 $scheme://$http_host/waread/;
}

# SSE-Endpunkt: darf nicht gepuffert werden und braucht ein langes Lese-Timeout.
# Exakter Treffer, daher hat er Vorrang vor dem allgemeinen Block darunter.
location = /waread/events {
    proxy_pass http://127.0.0.1:8780/events;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # Das Backend sollte regelmäßig einen SSE-Kommentar/Keepalive senden; ohne Daten
    # trennt Nginx die Verbindung nach proxy_read_timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    1h;

    proxy_hide_header X-Powered-By;
    access_log off;
}

# Alles andere (UI, /api/..., Medien, /healthz).
location ^~ /waread/ {
    # Das "/" am Ende entfernt den Präfix /waread/ vor der Weitergabe.
    proxy_pass http://127.0.0.1:8780/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Weiterleitungen des Backends mit absolutem Pfad (z. B. "/login") bekommen den
    # Präfix zurück. Sendet das Backend bereits "/waread/..."-Pfade, diese Zeile entfernen.
    proxy_redirect / /waread/;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Es gibt nur kleine Anfragen (Login, Einstellungen); Uploads existieren nicht.
    client_max_body_size 256k;

    proxy_hide_header X-Powered-By;

    # Sicherheits-Header (CSP, nosniff, Content-Disposition für Dokumente) setzt das
    # Backend. Hier absichtlich kein add_header, damit sie nicht doppelt gesendet werden.

    # Kein Access-Log für waread: URLs (Suchbegriffe, Medienpfade) können Inhalte
    # verraten, und die Sicherheits-Baseline will keine Inhalte in Logs. Wer Zugriffe
    # protokollieren möchte, entfernt diese Zeile (und die gleiche oben).
    access_log off;

    # OPTIONAL: zusätzliche Sperre auf das Heimnetz. Bewusst auskommentiert, weil sich
    # die richtigen Adressbereiche nicht erraten lassen (Routerspezifisch, außerdem
    # können Geräte im LAN auch globale IPv6-Adressen haben und würden ausgesperrt).
    #   allow 127.0.0.1;
    #   allow 192.168.0.0/16;
    #   allow 10.0.0.0/8;
    #   allow 172.16.0.0/12;
    #   deny  all;
}
